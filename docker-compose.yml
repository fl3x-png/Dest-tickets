services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://destination:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db/destination
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: destination
      POSTGRES_DB: destination
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U destination"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
